name: Ratedly
description: A new Flutter project.
version: 1.0.27+30

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.7
  firebase_analytics: ^11.5.0

  # ── Supabase ──
  supabase_flutter: ^2.9.1

  # ── Auth ──
  google_sign_in: ^6.1.11
  sign_in_with_apple: ^7.0.1

  # ── IAP ──
  purchases_flutter: ^8.0.0

  # ── Ads ──
  google_mobile_ads: ^6.0.0

  # ── UI & State ──
  provider: ^6.0.1
  flutter_native_splash: ^2.3.10
  cached_network_image: ^3.3.0
  country_code_picker: ^3.4.1
  country_flags: ^3.2.0
  share_plus: ^11.1.0

  # ── Media ──
  image_picker: ^1.1.2
  image: ^4.0.17
  flutter_image_compress: ^2.0.0
  video_player: ^2.8.2
  video_trimmer: ^5.0.0
  camera: ^0.10.5+9
  photo_manager: ^3.3.0

  # ── Storage & Prefs ──
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # ── Notifications ──
  flutter_local_notifications: ^19.3.0

  # ── Utilities ──
  uuid: ^4.5.1
  timeago: ^3.7.0
  permission_handler: ^11.0.0
  country_detector: ^1.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

dependency_overrides:
  path: ^1.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/22.png
    - assets/logo/google-logo.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
          style: italic
